<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notify Shubbyy &bull; Instant Trigger</title>
  <meta name="description" content="Ultra-sleek Material 3 instant notification trigger connecting directly to Android devices.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Bundled local MQTT client with fallback -->
  <script src="mqtt.min.js"></script>
  <script>
    if (typeof mqtt === 'undefined') {
      document.write('<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div class="m3-scaffold">
    <!-- Top App Bar -->
    <header class="m3-top-bar">
      <div class="m3-brand">
        <div class="m3-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <span class="m3-title">Notify <strong>Shubbyy</strong></span>
      </div>

      <div class="m3-status-chip" id="connectionChip">
        <span class="m3-status-dot"></span>
        <span class="m3-status-label" id="connectionText">Connecting...</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="m3-main-card">
      <!-- Central Hero Trigger Button -->
      <div class="m3-trigger-container">
        <div class="m3-trigger-aura" id="triggerAura"></div>
        <button id="triggerBtn" class="m3-fab-trigger" aria-label="Trigger Phone Alert" disabled>
          <div class="m3-fab-ripple"></div>
          <div class="m3-fab-content">
            <svg class="m3-fab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span class="m3-fab-label">NOTIFY</span>
            <span class="m3-fab-sublabel" id="triggerSubtext">CONNECTING</span>
          </div>
        </button>
      </div>

      <!-- M3 Segmented Alert Mode Selector -->
      <div class="m3-segmented-control" role="group" aria-label="Alert Mode Selection">
        <button class="m3-segment active" data-type="beep" id="segBeep">
          <span class="m3-segment-icon">⚡</span>
          <span>Beep</span>
        </button>
        <button class="m3-segment" data-type="urgent" id="segUrgent">
          <span class="m3-segment-icon">🚨</span>
          <span>Siren</span>
        </button>
        <button class="m3-segment" data-type="vibrate" id="segVibrate">
          <span class="m3-segment-icon">📳</span>
          <span>Vibrate</span>
        </button>
      </div>

      <!-- Minimal Information & Fixed Channel Card -->
      <div class="m3-info-row">
        <div class="m3-meta-pill" title="Locked Channel">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span class="m3-pill-value">shubbyy/notify/instant</span>
        </div>

        <div class="m3-meta-pill" title="Total Dispatches">
          <span class="m3-pill-label">Dispatched:</span>
          <span class="m3-pill-value" id="signalCountText">0</span>
        </div>
      </div>
    </main>

    <!-- Sleek M3 Footer -->
    <footer class="m3-footer">
      <p>Direct low-power WebSocket connection &bull; No servers &bull; Instant Delivery</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
