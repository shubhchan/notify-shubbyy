name: Build APK to Telegram

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK and Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO || secrets.TELEGRAM_CHAT_ID || '-1004474033865' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK and check file size
        run: |
          APK_SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Built: $APK_SRC"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK_DST="notify-shubbyy-release-${SHORT_SHA}.apk"
          cp "$APK_SRC" "$APK_DST"
          ls -lh "$APK_DST"
          APK_BYTES=$(stat -c%s "$APK_DST")
          echo "APK Size: $APK_BYTES bytes"
          echo "APK_PATH=$APK_DST" >> "$GITHUB_ENV"
          echo "APK_BYTES=$APK_BYTES" >> "$GITHUB_ENV"
          # Telegram Bot API has a strict 50 MB (52,428,800 bytes) limit for bot uploads
          if [ "$APK_BYTES" -lt 50000000 ]; then
            echo "DIRECT_TG_UPLOAD=true" >> "$GITHUB_ENV"
          else
            echo "DIRECT_TG_UPLOAD=false" >> "$GITHUB_ENV"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notify-shubbyy-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Sanitize Telegram Credentials
        run: |
          CLEAN_TOKEN=$(echo -n "${TELEGRAM_TOKEN}" | tr -d '\r\n ')
          CLEAN_TO=$(echo -n "${TELEGRAM_TO}" | tr -d '\r\n ')
          echo "TG_TOKEN=${CLEAN_TOKEN}" >> "$GITHUB_ENV"
          echo "TG_TO=${CLEAN_TO}" >> "$GITHUB_ENV"

      - name: Warn if Telegram secrets are missing
        if: ${{ env.TG_TOKEN == '' || env.TG_TO == '' }}
        run: |
          echo "::warning::Telegram secrets not set. APK is saved as a workflow artifact, but was NOT sent to Telegram."

      - name: Send APK to Telegram Channel
        id: send_apk
        if: ${{ env.TG_TOKEN != '' && env.TG_TO != '' && env.DIRECT_TG_UPLOAD == 'true' }}
        run: |
          echo "Dispatching release APK to Telegram channel ${TG_TO}..."
          CAPTION="🚀 *New Notify Shubbyy Release APK Ready!*

*Repository:* ${{ github.repository }}
*Branch:* ${{ github.ref_name }}
*Commit:* ${{ github.sha }}
*Pushed By:* ${{ github.actor }}

📱 Tap the attached Release APK file below to install directly on your phone!"

          RESPONSE=$(curl -s -S -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="${TG_TO}" \
            -F document=@"${APK_PATH}" \
            -F parse_mode="Markdown" \
            -F caption="${CAPTION}")

          echo "Telegram Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Uploaded to Telegram successfully!"
            echo "UPLOAD_SUCCESS=true" >> "$GITHUB_ENV"
          else
            echo "Upload to Telegram failed!"
            echo "UPLOAD_SUCCESS=false" >> "$GITHUB_ENV"
          fi

      - name: Send Fallback Message to Telegram (if direct upload failed or file was too large)
        if: ${{ env.TG_TOKEN != '' && env.TG_TO != '' && (env.DIRECT_TG_UPLOAD != 'true' || env.UPLOAD_SUCCESS != 'true') }}
        run: |
          TEXT="🚀 *New Notify Shubbyy Release APK Successful!*

*Repository:* ${{ github.repository }}
*Branch:* ${{ github.ref_name }}
*Commit:* ${{ github.sha }}
*Pushed By:* ${{ github.actor }}

📦 [Download Workflow Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -S -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -F chat_id="${TG_TO}" \
            -F parse_mode="Markdown" \
            -F text="${TEXT}"
