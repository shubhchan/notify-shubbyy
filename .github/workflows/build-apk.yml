name: Build APK to Telegram

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK and Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO || secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK and check file size
        run: |
          APK_SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Built: $APK_SRC"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK_DST="notify-shubbyy-release-${SHORT_SHA}.apk"
          cp "$APK_SRC" "$APK_DST"
          ls -lh "$APK_DST"
          APK_BYTES=$(stat -c%s "$APK_DST")
          echo "APK Size: $APK_BYTES bytes"
          echo "APK_PATH=$APK_DST" >> "$GITHUB_ENV"
          echo "APK_BYTES=$APK_BYTES" >> "$GITHUB_ENV"
          if [ "$APK_BYTES" -lt 50000000 ]; then
            echo "DIRECT_TG_UPLOAD=true" >> "$GITHUB_ENV"
          else
            echo "DIRECT_TG_UPLOAD=false" >> "$GITHUB_ENV"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notify-shubbyy-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Check Telegram Credentials
        run: |
          CLEAN_TOKEN=$(printf '%s' "${TELEGRAM_TOKEN}" | tr -d '\r\n ')
          CLEAN_TO=$(printf '%s' "${TELEGRAM_TO}" | tr -d '\r\n ')
          echo "TG_TOKEN=${CLEAN_TOKEN}" >> "$GITHUB_ENV"
          echo "TG_TO=${CLEAN_TO}" >> "$GITHUB_ENV"
          if [ -z "$CLEAN_TOKEN" ] || [ -z "$CLEAN_TO" ]; then
            echo "TG_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::Telegram secrets are not configured; skipping upload."
          else
            echo "TG_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Send APK to Telegram Channel
        id: send_apk
        if: ${{ env.DIRECT_TG_UPLOAD == 'true' && env.TG_CONFIGURED == 'true' }}
        run: |
          echo "Dispatching release APK to Telegram channel ${TG_TO}..."
          CAPTION=$(printf "🚀 *New Notify Shubbyy Release APK Ready!*\n\n*Repository:* %s\n*Branch:* %s\n*Commit:* %s\n*Pushed By:* %s\n\n📱 Tap the attached Release APK file below to install directly on your phone!" "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}")
          
          RESPONSE=$(curl -s -S -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="${TG_TO}" \
            -F document=@"${APK_PATH}" \
            -F parse_mode="Markdown" \
            -F caption="${CAPTION}")
          
          echo "Telegram Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Uploaded to Telegram successfully!"
            echo "UPLOAD_SUCCESS=true" >> "$GITHUB_ENV"
          else
            echo "Upload to Telegram failed!"
            echo "UPLOAD_SUCCESS=false" >> "$GITHUB_ENV"
          fi

      - name: Send Fallback Message to Telegram (if direct upload failed or file was too large)
        if: ${{ env.TG_CONFIGURED == 'true' && (env.DIRECT_TG_UPLOAD != 'true' || env.UPLOAD_SUCCESS != 'true') }}
        run: |
          TEXT=$(printf "🚀 *New Notify Shubbyy Release APK Successful!*\n\n*Repository:* %s\n*Branch:* %s\n*Commit:* %s\n*Pushed By:* %s\n\n📦 [Download Release APK](https://github.com/%s/actions/runs/%s)" "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" "${{ github.repository }}" "${{ github.run_id }}")
          
          curl -s -S -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -F chat_id="${TG_TO}" \
            -F parse_mode="Markdown" \
            -F text="${TEXT}"
